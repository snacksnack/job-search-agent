<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Scout — Table</title>
<style>
{{CSS}}
</style>
</head>
<body>
<div class="wrap wide">
  <header>
    <span class="logo-hex" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="12 2.5 20.5 7.25 20.5 16.75 12 21.5 3.5 16.75 3.5 7.25"></polygon></svg></span>
    <h1>Job Board</h1>
    <span class="pill" id="totalPill">{{TOTAL}} roles</span>
    <span class="live" title="Board is served live from local state"><span class="live-dot"></span>Live</span>
  </header>
  <div class="toolbar" id="toolbar">
    <div class="controls">
      <input id="search" type="text" placeholder="Search company, title, tag, location…" oninput="applyFilters()">
      <label class="toggle"><input type="checkbox" id="showApplied" onchange="onToggle('applied', this.checked)"> Show applied</label>
      <label class="toggle"><input type="checkbox" id="showHidden" onchange="onToggle('hidden', this.checked)"> Show hidden</label>
      <select id="prepFilter" class="filter-select" onchange="applyFilters()" title="Filter by interview-prep kit">
        <option value="all">Prep: all</option>
        <option value="has">Has prep pack</option>
        <option value="none">No prep pack</option>
      </select>
      <button class="ghost" onclick="location.reload()">Refresh</button>
      <button class="ghost" onclick="resetState()">Reset state</button>
      <a class="ghost view-toggle" id="boardLink" href="/">▦ Board view</a>
    </div>
    <div class="counts">
      <button type="button" class="cfilter" data-view="active" onclick="setView('active')" title="Show active jobs only"><span id="shownCount">{{SHOWN}}</span> shown</button> ·
      <button type="button" class="cfilter" data-view="all" onclick="setView('all')" title="Show every job">{{TOTAL}} total</button> ·
      <button type="button" class="cfilter" data-view="applied" onclick="setView('applied')" title="Show applied jobs only">{{APPLIED}} applied</button> ·
      <button type="button" class="cfilter" data-view="hidden" onclick="setView('hidden')" title="Show hidden jobs only">{{HIDDEN}} hidden</button> ·
      <span class="cstat">top match {{TOP_MATCH}}</span>
    </div>
  </div>
  <table class="jobtable" id="jobtable">
    <thead>
      <tr>
        <th data-sort="score" title="Sort by match score">Match</th>
        <th data-sort="title">Title</th>
        <th data-sort="company">Company</th>
        <th data-sort="salary">Salary</th>
        <th>Location</th>
        <th data-sort="posted">Posted</th>
        <th>Source</th>
        <th>Status</th>
        <th>Prep</th>
        <th>Links</th>
      </tr>
    </thead>
    <tbody id="rows">{{ROWS}}</tbody>
  </table>
  <footer>Run date {{RUN_DATE}} · source of truth: data/jobs.json + data/state.json · generated {{GENERATED}}</footer>
</div>
<div class="toast" id="toast"></div>
<script>
{{JS}}
</script>
</body>
</html>
